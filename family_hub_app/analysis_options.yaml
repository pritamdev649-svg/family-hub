# Static analysis for the FamilyHub Flutter app.
# Run: `flutter analyze` (or `dart analyze <paths>`).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `flutter gen-l10n` (run `dart run tool/l10n.dart`).
    - lib/l10n/*.dart
    - build/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    always_use_package_imports: true
    require_trailing_commas: false
