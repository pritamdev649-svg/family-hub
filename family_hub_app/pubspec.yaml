name: family_hub
description: "FamilyHub - run your family like a well-organised company: roles, tasks, shared ledger, notices, SOS and emergency cards."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0

  # Networking & storage (backend = Node/MongoDB REST API)
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Device features
  geolocator: ^14.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

  # UI / formatting
  cached_network_image: ^3.4.1
  intl: any # pinned by flutter_localizations
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # generates lib/l10n/app_localizations*.dart from the .arb files
